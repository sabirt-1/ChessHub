


{% extends 'base.html' %}

{% block content %}

<h2 style="margin-bottom:20px;"> Edit Profile</h2>

<div class="card profile-card">

    <div class="profile-image">
        {% if request.user.image %}
            <img src="{{ request.user.image.url }}">
        {% else %}
            <img src="/static/default.png">
        {% endif %}
    </div>

    <form method="POST" enctype="multipart/form-data" class="profile-form">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" value="{{ request.user.username }}">

        <label>Email</label>
        <input type="email" name="email" value="{{ request.user.email }}">

        <label>Age</label>
        <input type="number" name="age" value="{{ request.user.age }}">

        <label>Gender</label>
        <select name="gender">
            <option>{{ request.user.gender }}</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <label>Profile Image</label>
        <input type="file" name="image">

        <div class="actions">
            <button type="submit" class="btn">Update</button>
            <a href="/dashboard/" class="btn cancel">Cancel</a>
        </div>

    </form>

</div>

<style>

/* CARD LAYOUT */
.profile-card {
    display: flex;
    gap: 30px;
    align-items: center;
}

/* IMAGE */
.profile-image img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #7c3aed;
    object-fit: cover;
}

/* FORM */
.profile-form {
    flex: 1;
}

.profile-form label {
    display: block;
    margin-top: 10px;
    color: #aaa;
    font-size: 14px;
}

.profile-form input,
.profile-form select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.05);
    color: white;
}

/* ACTION BUTTONS */
.actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

/* BUTTONS */
.btn {
    background: linear-gradient(135deg, #7c3aed, #9333ea);
    border: none;
    padding: 10px 16px;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
    display: inline-block;
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(124,58,237,0.6);
}

/* CANCEL BUTTON */
.cancel {
    background: #444;
}

.cancel:hover {
    background: #666;
}

</style>

{% endblock %}
